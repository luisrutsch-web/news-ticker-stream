# Save this file at: .github/workflows/update-headlines.yml
# in your GitHub repo (create the .github/workflows/ folders if needed).

name: Update Ticker Headlines

on:
  schedule:
    - cron: "*/20 * * * *"   # runs every 20 minutes
  workflow_dispatch:          # lets you also trigger it manually from GitHub

permissions:
  contents: write

jobs:
  update-headlines:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run headline fetch script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_headlines.py

      - name: Commit updated headlines.json
        run: |
          git config user.name "headline-bot"
          git config user.email "headline-bot@users.noreply.github.com"
          git add headlines.json
          git diff --quiet --cached || git commit -m "Update headlines"
          git push
