<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>News Ticker Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent; /* transparent so OBS can layer this over your video/background */
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  .overlay {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* Top-left info boxes: location + clock */
  .info-stack {
    position: absolute;
    top: 20px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .info-box {
    background: #000;
    color: #fff;
    font-weight: bold;
    font-size: 20px;
    padding: 6px 14px;
    display: inline-block;
    width: fit-content;
  }

  /* Bottom breaking-news flag */
  .breaking-flag {
    position: absolute;
    bottom: 60px;
    left: 0;
    background: #d81f26;
    color: #fff;
    font-style: italic;
    font-weight: bold;
    font-size: 22px;
    padding: 10px 40px 10px 24px;
    clip-path: polygon(0 0, 100% 0, 92% 100%, 0% 100%);
  }

  /* Red divider bar under the flag */
  .red-bar {
    position: absolute;
    bottom: 48px;
    left: 0;
    width: 100%;
    height: 12px;
    background: #d81f26;
  }

  /* White ticker track */
  .ticker-track {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 48px;
    background: #ffffff;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  .ticker-content {
    display: inline-flex;
    white-space: nowrap;
    animation: scroll-left 40s linear infinite;
    font-size: 30px;
    font-weight: 900;
    color: #000;
    letter-spacing: 1px;
  }

  .ticker-content span {
    padding-right: 60px;
  }

  @keyframes scroll-left {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>
<body>

<div class="overlay">

  <div class="info-stack">
    <div class="info-box" id="location">New York City</div>
    <div class="info-box" id="clock">--:-- --</div>
  </div>

  <div class="breaking-flag">BREAKING NEWS</div>
  <div class="red-bar"></div>

  <div class="ticker-track">
    <div class="ticker-content" id="ticker">
      <span id="ticker-a">Loading headlines...</span>
      <span id="ticker-b">Loading headlines...</span>
    </div>
  </div>

</div>

<script>
  // ---- LIVE CLOCK (locked to New York time, auto-adjusts for DST) ----
  function updateClock() {
    const now = new Date();
    // Format directly in the America/New_York timezone so this is correct
    // no matter where Upstream's server actually renders this page.
    const timeStr = now.toLocaleTimeString('en-US', {
      timeZone: 'America/New_York',
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    });
    document.getElementById('clock').textContent = timeStr;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ---- HEADLINE TICKER ----
  // Edit this array manually, OR replace with a fetch() to headlines.json (see automation script).
  let headlines = [
    "Welcome to the stream — headlines will update automatically",
    "Replace this list or connect headlines.json to go live"
  ];

  function renderTicker() {
    const text = headlines.join("     •     ");
    // duplicate the text so the loop is seamless
    document.getElementById('ticker-a').textContent = text;
    document.getElementById('ticker-b').textContent = text;
  }
  renderTicker();

  // ---- OPTIONAL: auto-refresh from a local JSON file every 60 seconds ----
  // Point this at wherever your automation script writes headlines.json
  async function refreshHeadlines() {
    try {
      const res = await fetch('headlines.json', { cache: 'no-store' });
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        headlines = data;
        renderTicker();
      }
    } catch (e) {
      // headlines.json not found yet — keep showing current list, fail silently
      console.log('No headlines.json found yet, using default list.');
    }
  }
  refreshHeadlines();
  setInterval(refreshHeadlines, 60000); // check for new headlines every 60s
</script>

  
</body>
</html>
